services:
  postgres:
    image: postgres:16-alpine
    container_name: learning-makes-difference-postgres
    environment:
      POSTGRES_DB: learning_makes_difference
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learning_makes_difference"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "55432:5432"
    volumes:
      - learning-makes-difference-postgres:/var/lib/postgresql/data

volumes:
  learning-makes-difference-postgres:
